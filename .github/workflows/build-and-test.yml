name: Build and test

# Builds the GTK 4 backend and runs all three unit-test suites (Core, XAML, and the real-GTK-widget
# renderer suite) on Windows, Linux and macOS. Per-OS logic lives in scripts/ci/. The GTK 4 runtime
# is obtained per OS: gvsbuild (Windows, via GtkSharp4.targets during the build), apt libgtk-4-1
# (Linux), Homebrew (macOS). GtkSharp4 itself is restored from the committed vendored feed in
# build/gtksharp4-packages/ (the binding is a fork, not on nuget.org). This supersedes the old
# linux-gtk.yml.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # GitInfo derives the package version from history; a shallow clone makes it guess and the
          # build emits MSB3073 "could not retrieve first commit" noise.
          fetch-depth: 0
          # Gtk4.Wpf.sln references the unmodified WPF HelloWorld sample in the (public) WPF-Samples
          # submodule.
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          # 10.0.x is what everything targets; 8.0.x carries the .NET 8 runtime Net4x.NuGetUtility's
          # Windows-only MSBuild tasks need (several csproj files reference it under '$(OS)' ==
          # 'Windows_NT').
          dotnet-version: |
            8.0.x
            10.0.x
      - run: pwsh scripts/ci/test-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: '**/*.trx'

  linux:
    name: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: bash scripts/ci/test-linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: '**/*.trx'

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 45
    # Does not gate: on the hosted macOS runner the GTK test process freezes for up to ~30 s at a time
    # (GtkPump STALL lines: ~135 a run, 380-530 s in total, with App Nap off), so a different time-bounded
    # test fails each run. It still runs and reports; Windows and Linux gate.
    continue-on-error: true
    # The arm64 runner's empty netstandard2.0 targeting pack (CS0518)
    # is handled in the library csproj files (implicit framework reference off, netstandard.dll
    # referenced explicitly from the package). The real-GTK-4 renderer suite runs through a thread-0
    # runner (GTK 4's Quartz backend requires thread 0, which `dotnet test` owns; the test assembly is
    # executed directly and its custom entry point owns thread 0).
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: bash scripts/ci/test-macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-macos
          path: '**/*.trx'
