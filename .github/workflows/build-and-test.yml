name: Build and test

# Builds the GTK 4 backend and runs all three unit-test suites (Core, XAML, and the real-GTK-widget
# renderer suite) on Windows, Linux and macOS. Per-OS logic lives in scripts/ci/. The GTK 4 runtime
# is obtained per OS: gvsbuild (Windows, via GtkSharp4.targets during the build), apt libgtk-4-1
# (Linux), Homebrew (macOS). GtkSharp4 itself is restored from the committed vendored feed in
# build/gtksharp4-packages/ (the binding is a fork, not on nuget.org). This supersedes the old
# linux-gtk.yml.
on:
  push:
    branches: [5.0.0]
  pull_request:
    branches: [5.0.0]
  workflow_dispatch:

jobs:
  windows:
    name: windows
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # GitInfo derives the package version from history; a shallow clone makes it guess and the
          # build emits MSB3073 "could not retrieve first commit" noise.
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          # 10.0.x is what everything targets; 8.0.x carries the .NET 8 runtime Net4x.NuGetUtility's
          # Windows-only MSBuild tasks need (several csproj files reference it under '$(OS)' ==
          # 'Windows_NT').
          dotnet-version: |
            8.0.x
            10.0.x
      - run: pwsh scripts/ci/test-windows.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: '**/*.trx'

  linux:
    name: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: bash scripts/ci/test-linux.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: '**/*.trx'

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 45
    # NON-GATING (continue-on-error): the macOS job runs all three suites, and the real-GTK-4 renderer
    # suite runs through a thread-0 runner (GTK 4's Quartz backend requires thread 0, which
    # `dotnet test` owns; the test assembly is executed directly and its custom entry point owns
    # thread 0 - see scripts/ci/test-macos.sh). It is informational for now because the GitHub macOS
    # (arm64) runner currently fails every netstandard2.0 compile with CS0518 "Predefined type
    # 'System.Object' is not defined" - the SDK's implicit NETStandard.Library.Ref is not handed to
    # the compiler. The same build was green on an earlier runner image and it fails on both 10.0.100
    # and 10.0.404, so it is a runner regression, not this repo's code or SDK choice; it could not be
    # worked around from CI (explicit NETStandard.Library ref, serial build, SDK pin all tried). The
    # thread-0 runner itself is validated on Windows. Remove continue-on-error to re-gate once the
    # runner image recovers; Windows and Linux already gate with the full renderer suite.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: bash scripts/ci/test-macos.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-macos
          path: '**/*.trx'
